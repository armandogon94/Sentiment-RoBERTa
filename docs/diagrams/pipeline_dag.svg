<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title description">
  <title id="title">Sentiment RoBERTa pipeline DAG</title>
  <desc id="description">Real Amazon reviews feed measured runs, while a separate seeded generator creates only synthetic smoke fixtures. Both paths share loading and split code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .node { fill: #f7f5ff; stroke: #6650a4; stroke-width: 2; rx: 8; }
      .artifact { fill: #eef7ff; stroke: #27668b; stroke-width: 2; rx: 8; }
      .decision { fill: #fff8e6; stroke: #9a6700; stroke-width: 2; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; marker-end: url(#arrow); }
      .label { font: 15px Arial, Helvetica, sans-serif; fill: #202020; text-anchor: middle; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #404040; text-anchor: middle; }
      .edge-label { font: 12px Arial, Helvetica, sans-serif; fill: #333333; text-anchor: middle; }
    </style>
  </defs>

  <rect class="node" x="20" y="50" width="220" height="76"/>
  <text class="label" x="130" y="79">fancyzhx/amazon_polarity</text>
  <text class="small" x="130" y="103">parquet, Apache-2.0</text>

  <rect class="artifact" x="300" y="50" width="205" height="76"/>
  <text class="label" x="402.5" y="79">data/raw/*.parquet</text>
  <text class="small" x="402.5" y="103">gitignored, verified</text>

  <rect class="node" x="20" y="250" width="220" height="76"/>
  <text class="label" x="130" y="279">scripts/make_sample.py</text>
  <text class="small" x="130" y="303">seeded text templates</text>

  <rect class="artifact" x="300" y="250" width="205" height="76"/>
  <text class="label" x="402.5" y="279">data/sample/*.csv</text>
  <text class="small" x="402.5" y="303">synthetic, committed</text>

  <rect class="node" x="565" y="150" width="190" height="96"/>
  <text class="label" x="660" y="179">datasets/loading.py</text>
  <text class="small" x="660" y="203">label, title, text</text>
  <text class="small" x="660" y="225">one canonical schema</text>

  <polygon class="decision" points="815,150 1015,150 1045,198 1015,246 815,246 785,198"/>
  <text class="label" x="915" y="188">datasets/splits.py</text>
  <text class="small" x="915" y="214">train, validation, test</text>

  <rect class="node" x="1095" y="70" width="190" height="76"/>
  <text class="label" x="1190" y="99">TF-IDF control</text>
  <text class="small" x="1190" y="123">logistic regression</text>

  <rect class="node" x="1095" y="250" width="190" height="76"/>
  <text class="label" x="1190" y="279">RoBERTa</text>
  <text class="small" x="1190" y="303">MPS, val-selected</text>

  <rect class="artifact" x="1335" y="150" width="145" height="96"/>
  <text class="label" x="1407.5" y="179">run artifacts</text>
  <text class="small" x="1407.5" y="203">metrics, scores</text>
  <text class="small" x="1407.5" y="225">history, metadata</text>

  <rect class="artifact" x="1040" y="400" width="150" height="66"/>
  <text class="label" x="1115" y="427">Wilson intervals</text>
  <text class="small" x="1115" y="449">exact McNemar</text>

  <rect class="artifact" x="1220" y="400" width="120" height="66"/>
  <text class="label" x="1280" y="438">RESULTS.md</text>

  <rect class="artifact" x="1370" y="400" width="110" height="66"/>
  <text class="label" x="1425" y="427">publication</text>
  <text class="small" x="1425" y="449">figures</text>

  <path class="edge" d="M240 88 H300"/>
  <text class="edge-label" x="270" y="78">download</text>
  <path class="edge" d="M240 288 H300"/>
  <text class="edge-label" x="270" y="278">generate</text>
  <path class="edge" d="M505 88 H535 Q555 88 555 108 V168 H565"/>
  <path class="edge" d="M505 288 H535 Q555 288 555 268 V228 H565"/>
  <path class="edge" d="M755 198 H785"/>
  <path class="edge" d="M1045 178 H1065 Q1085 178 1085 158 V108 H1095"/>
  <path class="edge" d="M1045 218 H1065 Q1085 218 1085 238 V288 H1095"/>
  <path class="edge" d="M1285 108 H1315 Q1325 108 1325 128 V178 H1335"/>
  <path class="edge" d="M1285 288 H1315 Q1325 288 1325 268 V218 H1335"/>
  <path class="edge" d="M1407 246 V360 Q1407 380 1387 380 H1115 V400"/>
  <path class="edge" d="M1407 246 V360 Q1407 380 1387 380 H1280 V400"/>
  <path class="edge" d="M1407 246 V400"/>
</svg>
