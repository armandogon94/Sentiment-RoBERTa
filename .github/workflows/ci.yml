name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never downloads the source dataset and never fetches roberta-base from the hub.
# cfg/smoke.yaml builds a 2-layer random-weight model locally with an offline tokenizer, so
# what is under test is the architecture and the plumbing, not the weights.
# The TF-IDF control still needs NLTK resources; ADR 0007 documents that cold-run dependency.
# Rationale: docs/adr/0007-offline-smoke-path.md
env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONHASHSEED: "1337"

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy .

      - name: Tests
        run: |
          uv run pytest --cov --cov-report=term-missing \
            --cov-report=json:.pytest_cache/coverage.json \
            --junitxml=.pytest_cache/junit.xml --cov-fail-under=70

      - name: Published test and coverage claims are reproducible
        if: matrix.python-version == '3.12'
        run: |
          uv run python scripts/check_quality_claims.py --write \
            --coverage-json .pytest_cache/coverage.json --junit-xml .pytest_cache/junit.xml
          git diff --exit-code -- README.md reports/evidence/quality.json

      - name: Smoke train on the committed sample
        run: |
          uv run python train.py -c cfg/smoke.yaml --force
          test -f runs/latest/metrics.json
          uv run python - <<'PY'
          import json
          m = json.load(open("runs/latest/metrics.json"))
          assert 0.0 < m["accuracy"] < 1.0, m["accuracy"]
          assert m["models"]["roberta"]["random_weights"] is True, "CI must not fetch weights"
          print("smoke accuracy:", m["accuracy"])
          PY

      - name: Figures and report regenerate
        run: |
          uv run python scripts/export_figures.py -i runs/latest -o /tmp/figs --skip-model-figures
          uv run python evaluate.py -i runs/latest -o /tmp/RESULTS.md
          grep -q McNemar /tmp/RESULTS.md

  docs-drift:
    name: docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Every path in the README structure tree must exist
        run: |
          paths_file="$(mktemp)"
          # Same byte-safe extraction as scripts/verify_fresh_clone.sh, for the reason recorded
          # there: a bracket expression over the box-drawing characters is matched byte-wise in
          # the C locale and finds zero paths, so the rule's result depended on the runner's LANG.
          # Anchoring on the literal "── " works in either locale.
          sed -n -E 's/^[^A-Za-z0-9]*── ([A-Za-z0-9_./-]+).*/\1/p' README.md > "$paths_file" || true
          test -s "$paths_file" || { echo "README structure extraction found zero paths"; exit 1; }
          missing=0
          while read -r p; do
            [ -e "$p" ] || { echo "MISSING: $p"; missing=1; }
          done < "$paths_file"
          exit $missing

      - name: No agent scaffolding may be tracked
        run: |
          if git ls-files | grep -iE 'AGENT-BRIEF|CLAUDE\.md|AGENTS\.md|^PLAN\.md|PROGRESS\.md|\.claude/'; then
            echo "agent scaffolding is tracked"; exit 1
          fi

      - name: Committed data PII guard
        run: uv run --no-project python scripts/check_committed_data.py

      - name: Local Markdown links and image sources resolve
        run: uv run --no-project python scripts/check_markdown_links.py

      - name: Notebook provenance guard
        run: |
          uv run --no-project python - <<'PY'
          import json, pathlib
          orig = json.loads(pathlib.Path("notebooks/sentiment_analysis_roberta_ORIGINAL.ipynb").read_text())
          code = [c for c in orig["cells"] if c["cell_type"] == "code"]
          assert all(not c.get("outputs") for c in code), "the ORIGINAL notebook was executed"
          rerun = json.loads(pathlib.Path("notebooks/sentiment_analysis_roberta.ipynb").read_text())
          rcode = [c for c in rerun["cells"] if c["cell_type"] == "code"]
          assert any(c.get("outputs") for c in rcode), "the re-run notebook lost its outputs"
          print(f"ok: ORIGINAL {len(code)} cells unexecuted; re-run has outputs")
          PY

      - name: No unguarded plt.show()
        # stdlib only, so this job needs no dependency install. Same checker the fresh-clone
        # verifier and tests/test_utils.py use: one implementation of the rule, not three greps.
        run: uv run --no-project python scripts/check_no_blocking_show.py

      - name: The committed figure set must be complete
        run: |
          for f in confusion_matrix_baseline confusion_matrix_roberta training_curves \
                   attention_heatmap attention_from_token saliency_positive \
                   saliency_negative baseline_ablation embedding_space_3d \
                   layer_probe_accuracy attention_entropy_atlas; do
            test -f "docs/images/$f.png" || { echo "missing docs/images/$f.png"; exit 1; }
          done
          test "$(find docs/images -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 11 \
            || { echo "docs/images must contain exactly eleven PNGs"; exit 1; }

  published-evidence:
    name: published evidence and drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --python 3.12

      - name: Mermaid labels fit their rendered boxes
        run: uv run python scripts/check_diagram_text.py

      - name: Recompute every published headline number
        run: uv run python scripts/check_published_numbers.py

      - name: Verify measured test and coverage claims
        run: uv run python scripts/check_quality_claims.py

      - name: Regenerate and verify published figure data
        run: uv run python scripts/check_published_figures.py

      - name: Published report must be byte-reproducible from evidence
        # All three evidence directories, matching scripts/verify_fresh_clone.sh. reports/RESULTS.md
        # carries the five-epoch schedule section, and that section only exists when run_5 is passed
        # as -s; without it the regenerated file is 14 lines shorter and cmp fails.
        run: |
          uv run python evaluate.py -i reports/evidence/run_2 -a reports/evidence/run_3 \
            -s reports/evidence/run_5 -o /tmp/RESULTS.md
          cmp reports/RESULTS.md /tmp/RESULTS.md

  verify-fresh-clone:
    name: fresh-clone quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scripts/verify_fresh_clone.sh clones from this working copy

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the fresh-clone verifier
        run: ./scripts/verify_fresh_clone.sh
