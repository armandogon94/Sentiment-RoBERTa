[project]
name = "sentiment-roberta"
version = "0.1.0"
description = "Reproducible RoBERTa fine-tuning vs. a TF-IDF control on Amazon Review Polarity, with token-level interpretability, on Apple Silicon MPS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Armando Gonzalez" }]
keywords = ["nlp", "sentiment-analysis", "roberta", "transformers", "interpretability", "mps"]

dependencies = [
    # modelling
    "torch>=2.4",
    "transformers>=4.44",
    "scikit-learn>=1.5",
    # data
    "pandas>=2.2",
    "pyarrow>=17.0",          # amazon_polarity ships as parquet
    "nltk>=3.9",              # >=3.9 for the punkt_tab resource
    # statistics — Wilson intervals + exact McNemar
    "statsmodels>=0.14",
    # figures
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # config + logging
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "nbclient>=0.10",         # execute the narrative notebook headlessly
    "types-pyyaml",
    "pandas-stubs",
]

[project.urls]
"Kaggle original" = "https://www.kaggle.com/code/armandogon94/sentiment-analysis-using-roberta"
"Dataset" = "https://huggingface.co/datasets/fancyzhx/amazon_polarity"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasets", "models", "metrics", "interpretability", "utils"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes — F401 unused imports
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # use pathlib
    "NPY",       # numpy legacy random
    "ERA",       # ERA001 — commented-out code
    "T20",       # no print() in library code
    "RUF",
]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
# The entrypoints and scripts are allowed to write to stdout.
"train.py" = ["T20"]
"evaluate.py" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
# These ship no stubs. Everything we write is still strictly typed.
module = ["transformers.*", "nltk.*", "seaborn.*", "statsmodels.*", "sklearn.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: needs a real fine-tuning run; excluded from CI",
    "network: downloads model weights or data; excluded from CI",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["datasets", "models", "metrics", "interpretability", "utils"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
