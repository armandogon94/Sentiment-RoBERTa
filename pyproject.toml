[project]
name = "sentiment-roberta"
version = "0.1.0"
description = "Reproducible RoBERTa fine-tuning vs. a TF-IDF control on Amazon Review Polarity, with token-level interpretability, on Apple Silicon MPS."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Armando Gonzalez" }]
keywords = ["nlp", "sentiment-analysis", "roberta", "transformers", "interpretability", "mps"]

dependencies = [
    # modelling
    "torch==2.13.0",
    "transformers==5.14.1",
    "scikit-learn==1.9.0",
    # data
    "pandas==3.0.5",
    "pyarrow==25.0.0",          # amazon_polarity ships as parquet
    "nltk==3.10.0",              # 3.9+ is required for the punkt_tab resource
    # statistics: Wilson intervals + exact McNemar
    "statsmodels==0.14.6",
    # figures
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    # reads the JSON provenance payload back out of a published PNG (evaluate.py,
    # scripts/check_published_figures.py). A matplotlib transitive, declared because
    # this repo imports it directly.
    "pillow==12.3.0",
    # config + logging
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "tiktoken>=0.13.0",
    "sentencepiece>=0.2.2",
]

# Dev tooling lives in a PEP 735 dependency group, not an extra, so that a bare
# `uv sync` (what scripts/verify_fresh_clone.sh runs, verbatim from the README)
# installs everything the documented quickstart needs.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "nbclient==0.11.0",         # execute the narrative notebook headlessly
    "nbformat==5.10.4",
    "jupyter-core==5.9.1",
    "ipykernel==7.3.0",
    "types-pyyaml==6.0.12.20260724",
    "pandas-stubs==3.0.3.260530",
]

[project.urls]
"Homepage" = "https://github.com/armandogon94/Sentiment-RoBERTa"
"Repository" = "https://github.com/armandogon94/Sentiment-RoBERTa"
"Kaggle original" = "https://www.kaggle.com/code/armandogon94/sentiment-analysis-using-roberta"
"Dataset" = "https://huggingface.co/datasets/fancyzhx/amazon_polarity"

# Deliberately NOT an installable distribution. The house style is packages-at-root
# invoked from the repo root (`uv run python train.py`), and one of those packages is named
# `datasets/`, and installing it into site-packages would shadow HuggingFace `datasets`
# for anything else sharing the environment. See docs/adr/0006-local-packages-not-installed.md
[tool.uv]
package = false

# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks/ is excluded on purpose. sentiment_analysis_roberta_ORIGINAL.ipynb is the
# provenance artifact for a published Kaggle kernel and must stay byte-identical; linting
# it would tempt a fix, and its defects are the subject of this repo rather than a backlog.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: F401 unused imports
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # use pathlib
    "NPY",       # numpy legacy random
    "ERA",       # ERA001: commented-out code
    "T20",       # no print() in library code
    "RUF",
]
ignore = [
    "E501",            # line length is enforced by the formatter
    "RUF001", "RUF002", "RUF003",  # ×, –, ‖ etc. are deliberate typography in prose and captions
]

[tool.ruff.lint.per-file-ignores]
# The entrypoints and scripts are allowed to write to stdout.
"train.py" = ["T20"]
"evaluate.py" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["ARG"]
# NPY002 wants np.random.Generator. set_seed's whole job is to seed the LEGACY global state,
# because that is what scikit-learn and any third-party code reach for. Using a Generator here
# would seed nothing that those libraries consult.
"utils/seeding.py" = ["NPY002"]

[tool.ruff.format]
quote-style = "double"

# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
explicit_package_bases = true
mypy_path = "."
exclude = ["^notebooks/", "^runs/", "^\\.venv/"]

[[tool.mypy.overrides]]
# Tests are checked for correctness by running them. Requiring `-> None` on 130 test
# functions buys nothing and makes the signal-to-noise of `make lint` worse.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# These ship no stubs. Everything we write is still strictly typed.
module = [
    "transformers.*", "nltk.*", "statsmodels.*", "sklearn.*",
    "scipy.*", "pyarrow.*", "structlog.*",
]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: needs a real fine-tuning run; excluded from CI",
    "network: downloads model weights or data; excluded from CI",
]

[tool.coverage.run]
source = ["datasets", "models", "metrics", "interpretability", "utils"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
