# nbstripout is scoped to the ORIGINAL notebook ONLY.
# notebooks/sentiment_analysis_roberta.ipynb is the re-run narrative walkthrough and its
# saved outputs are a deliverable — stripping them would erase the point of Slice 7.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-pyyaml]
        pass_filenames: false
        args: ["."]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: ^notebooks/sentiment_analysis_roberta_ORIGINAL\.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(notebooks/|docs/images/|docs/diagrams/|data/sample/)
      - id: trailing-whitespace
        exclude: ^(notebooks/|docs/images/|docs/diagrams/|data/sample/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
