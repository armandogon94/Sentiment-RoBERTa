# There is deliberately NO nbstripout hook here. See scripts/check_notebooks.py.
#
# nbstripout was tried first, scoped to the ORIGINAL notebook alone. It has nothing to strip
# there (the file was published with zero outputs) but it DOES rewrite every cell id and reflow
# every `source` string into a list — a 93-line diff on the one file whose entire value is being
# unchanged. And the re-run notebook's saved outputs are a deliverable, so it must not be
# stripped either.
#
# The provenance guard enforces the two real invariants instead: the ORIGINAL never changes, and
# the re-run keeps its outputs.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-pyyaml]
        pass_filenames: false
        args: ["."]

  - repo: local
    hooks:
      - id: notebook-provenance
        name: notebook provenance guard
        entry: uv run python scripts/check_notebooks.py
        language: system
        files: ^notebooks/.*\.ipynb$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(notebooks/|docs/images/|docs/diagrams/|data/sample/)
      - id: trailing-whitespace
        exclude: ^(notebooks/|docs/images/|docs/diagrams/|data/sample/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
