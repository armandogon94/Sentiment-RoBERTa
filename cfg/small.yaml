# Small config — THE PUBLISHED RUN. Every headline number in the README and in
# reports/RESULTS.md was produced by this file.
#
# It is the source notebook's data scale (9,000 train / 1,000 test, seq 256, batch 32,
# lr 2e-5) with the epoch count cut from 5 to 3 so the job fits inside a hard 45-minute
# wall-clock cap. See docs/adr/0004-subset-size-and-published-config.md for the
# arithmetic. cfg/default.yaml is the untruncated 5-epoch notebook config; it has been run,
# and it measured that the two extra epochs cost accuracy rather than adding it, so this
# shorter schedule gives up nothing.
NAME: small
DESCRIPTION: >-
  The published configuration. Notebook data scale (9,000 / 1,000, seq 256) with the
  epoch count reduced to fit a 45-minute wall-clock cap. Epoch selection is on a
  stratified validation split; the test set is scored exactly once.

SEED: 1337

DATA:
  TRAIN_PATH: data/raw/train.parquet
  TEST_PATH: data/raw/test.parquet
  ROWS_READ_TRAIN: 200000        # rows parsed from the parquet before sampling
  ROWS_READ_TEST: 20000
  N_TRAIN: 9000                  # rows actually used (split into train + val below)
  N_TEST: 1000
  VAL_FRACTION: 0.1              # 8,100 train / 900 val — fixes the notebook's missing split

PREPROCESSING:
  LOWERCASE: true
  ALPHANUMERIC_ONLY: true
  REMOVE_STOPWORDS: true
  STEM: true
  NGRAM_RANGE: [1, 1]
  MAX_FEATURES: null

MODEL:
  NAME: roberta
  PRETRAINED: roberta-base
  # Deliberately unset: fill with the immutable revision resolved by the first online run.
  # No revision hash was recorded for the published run, so none is invented here.
  REVISION: null
  MAX_LEN: 256
  BATCH_SIZE: 32
  # 3, not the notebook's 5. Sized from a MEASURED rate, not a guess: cfg/dev.yaml ran
  # 1,800 rows at seq 128 in 65.4 s (57 steps, 1.15 s/step, MPS, Low Power Mode OFF).
  # Doubling the sequence length roughly doubles per-step cost, so 8,100 rows at seq 256 is
  # ~254 steps x ~2.4 s = ~10.2 min/epoch, plus ~25 s of validation. Three epochs lands
  # near 35 min, inside the 45-minute cap. cfg/default.yaml later ran the full five in
  # 57m 19.1s under a raised cap and found no gain past epoch 1, so this cut costs nothing.
  EPOCHS: 3
  LR: 2.0e-5
  WEIGHT_DECAY: 0.01
  NUM_LABELS: 2
  RANDOM_WEIGHT_LAYERS: null

BASELINE:
  C: 1.0
  MAX_ITER: 1000

RUNTIME:
  DEVICE: auto
  WALL_CLOCK_CAP_MIN: 45.0       # checked before every optimizer step, including epoch 1
  LOG_EVERY_STEPS: 25
  NUM_WORKERS: 0

RESULTS:
  OUTPUT_DIR: runs
  SAVE_FIGURES: true
