# Full config: 200,000 train / 20,000 test, 5 epochs, seq 256.
#
# ⚠️  NOT RUN. No runtime is claimed: this repo has neither a full-scale run nor a
# hardware-matched benchmark from which to support one. The file records experiment scope.
#
# The 45-minute cap in RUNTIME is left in place deliberately. Launching this file as-is
# checks the deadline before every optimizer step, can interrupt epoch 1, saves the partial
# model if no completed validation checkpoint exists, and records the partial epoch.
NAME: full
DESCRIPTION: >-
  Full-scale specification: 200,000 / 20,000, 5 epochs, seq 256. NOT RUN; no runtime
  estimate is published without a full-scale run or a hardware-matched benchmark.

SEED: 1337

DATA:
  TRAIN_PATH: data/raw/train.parquet
  TEST_PATH: data/raw/test.parquet
  ROWS_READ_TRAIN: 200000
  ROWS_READ_TEST: 20000
  N_TRAIN: 200000
  N_TEST: 20000
  VAL_FRACTION: 0.1

PREPROCESSING:
  LOWERCASE: true
  ALPHANUMERIC_ONLY: false       # at this scale there is no reason to destroy negation
  REMOVE_STOPWORDS: false
  STEM: false
  NGRAM_RANGE: [1, 2]
  MAX_FEATURES: 500000

MODEL:
  NAME: roberta
  PRETRAINED: roberta-base
  # Deliberately unset until an online run records the resolved immutable revision.
  REVISION: null
  MAX_LEN: 256
  BATCH_SIZE: 32
  EPOCHS: 5
  LR: 2.0e-5
  WEIGHT_DECAY: 0.01
  NUM_LABELS: 2
  RANDOM_WEIGHT_LAYERS: null

BASELINE:
  C: 1.0
  MAX_ITER: 2000

RUNTIME:
  DEVICE: auto
  WALL_CLOCK_CAP_MIN: 45.0       # enforced inside epochs, including epoch 1
  LOG_EVERY_STEPS: 100
  NUM_WORKERS: 0

RESULTS:
  OUTPUT_DIR: runs
  SAVE_FIGURES: true
