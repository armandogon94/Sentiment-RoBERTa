# Default config: the source Kaggle notebook's scale and its full 5-epoch schedule.
# 9,000 train / 1,000 test, seq 256, batch 32, lr 2e-5, 5 epochs.
#
# RUN. It answers one question: does training the notebook's whole schedule beat stopping
# early. It does not. Validation loss is lowest at epoch 1 (0.1279) and rises at every epoch
# after it, reaching 0.2337 at epoch 5; validation accuracy improves to 0.9522 at epoch 4 and
# then falls to 0.9344, below its own epoch 1. Epoch 1 is selected on validation loss.
# The per-epoch table is in README.md and reports/RESULTS.md, and the evidence it is
# recomputed from is reports/evidence/run_5/.
#
# It preserves the schedule as executable data with documented implementation departures:
# VAL_FRACTION adds validation; combined text uses `title + ". " + text`; and the control's
# vectorizer widens sklearn's token pattern. See README and docs/PROVENANCE.md.
#
# Reproduce:
#   PYTHONHASHSEED=1337 uv run python train.py -c cfg/default.yaml
NAME: default
DESCRIPTION: >-
  The notebook's untruncated schedule (9,000 / 1,000, seq 256, 5 epochs). Run once; it is the
  evidence that epochs beyond the first do not improve the selected checkpoint.

SEED: 1337

DATA:
  TRAIN_PATH: data/raw/train.parquet
  TEST_PATH: data/raw/test.parquet
  ROWS_READ_TRAIN: 200000
  ROWS_READ_TEST: 20000
  N_TRAIN: 9000
  N_TEST: 1000
  VAL_FRACTION: 0.1

PREPROCESSING:
  LOWERCASE: true
  ALPHANUMERIC_ONLY: true
  REMOVE_STOPWORDS: true
  STEM: true
  NGRAM_RANGE: [1, 1]
  MAX_FEATURES: null

MODEL:
  NAME: roberta
  PRETRAINED: roberta-base
  # Deliberately unset until an online run records the resolved immutable revision.
  REVISION: null
  MAX_LEN: 256
  BATCH_SIZE: 32
  EPOCHS: 5                      # the notebook's value, kept whole so it could be measured
  LR: 2.0e-5
  WEIGHT_DECAY: 0.01
  NUM_LABELS: 2
  RANDOM_WEIGHT_LAYERS: null

BASELINE:
  C: 1.0
  MAX_ITER: 1000

RUNTIME:
  DEVICE: auto
  WALL_CLOCK_CAP_MIN: 90.0       # 90, not 45, so all five epochs complete instead of being
                                 # truncated: the run took 57m 19.1s of wall clock. Still checked
                                 # before every optimizer step, so a partial epoch would be
                                 # recorded rather than silently dropped.
  LOG_EVERY_STEPS: 25
  NUM_WORKERS: 0

RESULTS:
  OUTPUT_DIR: runs
  SAVE_FIGURES: true
