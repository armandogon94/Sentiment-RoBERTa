# Default config — the source Kaggle notebook's scale and fixed 5-epoch schedule:
# 9,000 train / 1,000 test, seq 256, batch 32, lr 2e-5, 5 epochs.
#
# ⚠️  NOT RUN. The measured cfg/small.yaml epoch rate projects this schedule at 51–55
# minutes, beyond the 45-minute cap. No number anywhere in this repo came from this file.
#
# It preserves the schedule as executable data with documented implementation departures:
# VAL_FRACTION adds validation; combined text uses `title + ". " + text`; and the control's
# vectorizer widens sklearn's token pattern. See README and docs/PROVENANCE.md.
#
# To run all five epochs, raise the cap explicitly:
#   PYTHONHASHSEED=1337 uv run python train.py -c cfg/default.yaml  # after editing the cap
NAME: default
DESCRIPTION: >-
  Notebook-scale schedule specification (9,000 / 1,000, seq 256, 5 epochs).
  NOT RUN in this repo — projected at 51-55 min from the measured cfg/small.yaml rate.

SEED: 1337

DATA:
  TRAIN_PATH: data/raw/train.parquet
  TEST_PATH: data/raw/test.parquet
  ROWS_READ_TRAIN: 200000
  ROWS_READ_TEST: 20000
  N_TRAIN: 9000
  N_TEST: 1000
  VAL_FRACTION: 0.1

PREPROCESSING:
  LOWERCASE: true
  ALPHANUMERIC_ONLY: true
  REMOVE_STOPWORDS: true
  STEM: true
  NGRAM_RANGE: [1, 1]
  MAX_FEATURES: null

MODEL:
  NAME: roberta
  PRETRAINED: roberta-base
  # Deliberately unset until an online run records the resolved immutable revision.
  REVISION: null
  MAX_LEN: 256
  BATCH_SIZE: 32
  EPOCHS: 5                      # the notebook's value, and the reason this config is over cap
  LR: 2.0e-5
  WEIGHT_DECAY: 0.01
  NUM_LABELS: 2
  RANDOM_WEIGHT_LAYERS: null

BASELINE:
  C: 1.0
  MAX_ITER: 1000

RUNTIME:
  DEVICE: auto
  WALL_CLOCK_CAP_MIN: 45.0       # can interrupt epoch 1; any partial epoch is recorded
  LOG_EVERY_STEPS: 25
  NUM_WORKERS: 0

RESULTS:
  OUTPUT_DIR: runs
  SAVE_FIGURES: true
